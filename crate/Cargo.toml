[package]
name = "crate"
version = "0.1.0"
authors = ["Alec Thilenius <alec@thilenius.com>"]
description = "A logic simulation library written in Rust, inspired by KOHCTPYKTOP."
license = "MIT/Apache-2.0"
repository = "https://gitlab.com/athilenius/logic-paint-rs"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
arrayvec = { version = "0.7.6", features = ["serde"] }
base64 = "0.22.1"
bincode = "1.3.3"
console_error_panic_hook = { version = "0.1.7", optional = true }
enum_dispatch = "0.3"
futures = "0.3.32"
generational-arena = "0.2.9"
glam = { version = "0.33", features = ["serde", "bytemuck"] }
gloo="0.8.1"
im = { version = "15.1", features = ["serde"] }
itertools = "0.14.0"
js-sys = "0.3.100"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
yew = "0.19.3"

[dependencies.web-sys]
version = "0.3.100"
features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "KeyboardEvent",
  "MessageChannel",
  "MessagePort",
  "MouseEvent",
  "Storage",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WheelEvent",
  "Window",
  "console",
]
